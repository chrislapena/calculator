<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chris's Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="calculator-header">
            <h1>My Calculator</h1>
            <button type="button" id="theme-toggle" class="theme-toggle" role="switch" aria-checked="false" aria-label="Toggle light and dark mode" title="Switch to light mode">
                <span class="theme-toggle-track">
                    <span class="theme-icon icon-moon" aria-hidden="true">🌙</span>
                    <span class="theme-icon icon-sun" aria-hidden="true">☀️</span>
                    <span class="theme-toggle-thumb"></span>
                </span>
            </button>
        </div>

        <input type="text" id="display" value="0" readonly>

        <div class="buttons">
            <button onclick="clearDisplay()" class="clear">AC</button>
            <button onclick="addValue('7')">7</button>
            <button onclick="addValue('8')">8</button>
            <button onclick="addValue('9')">9</button>

            <button onclick="addValue('4')">4</button>
            <button onclick="addValue('5')">5</button>
            <button onclick="addValue('6')">6</button>
            <button onclick="addValue('3')">3</button>

            <button onclick="addValue('1')">1</button>
            <button onclick="addValue('2')">2</button>
            <button onclick="addValue('0')">0</button>
            <button onclick="addValue('+')">+</button>

            <button onclick="addValue('-')">−</button>
            <button onclick="addValue('*')">×</button>
            <button onclick="addValue('/')">÷</button>
            <button onclick="calculate()" class="equals">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
